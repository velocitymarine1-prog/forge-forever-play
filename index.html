<!doctype html>

<title>Forge Forever</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600;700;800&family=Alegreya:ital,wght@0,400;0,700;1,400&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Forge Forever: the main menu (design pass 9, card t66; built sideways first by design pass 11, card t69; landscape only since its
   amendment 9). The game's front door: rolling mountains at dusk over the whole screen (proto/dusk.js), the title on the smithy's oak
   sign hung from two chains, and three buttons in a column centred under it (on the right until 3 Oct 2026, when Isaac asked for the
   buttons and the name plank centred on the page). Landscape only: a phone held upright sees the turn plate, or,
   with My screen won't turn, the game laid out at height x width and turned a quarter (the cellar's rule; the script sizes the root
   and sets --gw and --gh, the game's own width and height, which the CSS uses in place of vw and vh). One dark look on purpose. */
:root{color-scheme:dark;--soot:#181425;--stone:#231c2e;--stone-2:#2c2540;--oak:#733e39;--oak-l:#b86f50;--oak-d:#3e2731;
  --parch:#ead4aa;--parch-2:#e4a672;--mute:#b3a48c;--dim:#8a7d6e;--ember:#f77622;--brass:#feae34;--hot:#fee761;--blood:#e43b44;--ice:#2ce8f5;
  --ink:#3e2731;--ink2:#733e39;--ink3:#a22633;
  --display:"Grenze Gotisch",Georgia,serif;--text:Alegreya,Georgia,serif;--data:"Pixelify Sans","Courier New",monospace;
  --st:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--soot);color:var(--parch);overscroll-behavior:none}
body{font-family:var(--text);font-size:16px;line-height:1.4;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;color:inherit;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--ice);outline-offset:2px}
.plank button:focus-visible,.turn button:focus-visible{outline-offset:-3px}
/* pixel frames (9-slice, made by smithy.js); each has a flat ground in case the frames can't be drawn */
.f-plank{border:12px solid transparent;background:var(--stone) padding-box;border-image:var(--frame-plank) 4 fill round;image-rendering:pixelated}
.f-iron{border:9px solid transparent;background:#3a4466 padding-box;border-image:var(--frame-iron) 4 fill round;image-rendering:pixelated}
.f-ember{border:9px solid transparent;background:#e4572e padding-box;border-image:var(--frame-ember) 4 fill round;image-rendering:pixelated}
.f-parch{border:12px solid transparent;background:var(--parch) padding-box;border-image:var(--frame-parchment) 4 fill round;image-rendering:pixelated}
.f-plank>*,.f-parch>*,.f-iron>*,.f-ember>*{image-rendering:auto}
.f-plank canvas,.f-parch canvas,.f-iron canvas,.f-ember canvas{image-rendering:pixelated}
/* the game root: the whole viewport, or laid out at height x width and turned a quarter in forced landscape (the script sizes it) */
.game{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;transform-origin:0 0;--gw:100vw;--gh:100vh}
/* the vista: one canvas at a whole number of device pixels per world pixel, placed to cover the game (dusk.js sizes it) */
.vista{position:absolute;left:0;top:0;z-index:0;display:block;background:var(--soot)}
/* the page: the sign across the top, the buttons (or the name plank) centred across the page in the room under it: their auto margins
   centre them up and down, and one taller than that room stands on the bottom and rises over the sign (auto margins give way, and
   align-self:end keeps it on the screen) */
.menu{position:absolute;inset:0;z-index:1;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"sign" "buttons";row-gap:8px;
  padding:calc(14px + var(--st)) calc(16px + var(--sr)) calc(16px + var(--sb)) calc(16px + var(--sl))}
.game.forced .menu{padding:calc(14px + var(--sr)) calc(16px + var(--sb)) calc(16px + var(--sl)) calc(16px + var(--st))}
/* the sign: the title on an oak board hung from two chains */
.sign{grid-area:sign;justify-self:center;position:relative;padding:2px 22px 8px;text-align:center;max-width:100%}
.sign h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(38px,min(calc(var(--gw) * .124),calc(var(--gh) * .115)),64px);line-height:1.02;color:var(--parch);text-shadow:0 3px 0 var(--soot);white-space:nowrap;letter-spacing:0}
.sign::before,.sign::after{content:"";position:absolute;bottom:calc(100% + 12px);width:4px;height:var(--gh);
  background:repeating-linear-gradient(to bottom,#8b9bb4 0 2px,#5a6988 2px 4px,#262b44 4px 6px,#181425 6px 7px);box-shadow:-1px 0 0 #181425,1px 0 0 #181425}
.sign::before{left:10px}
.sign::after{right:10px}
/* the three buttons */
.buttons{grid-area:buttons;display:grid;gap:10px;width:clamp(248px,calc(var(--gw) * .34),300px);max-width:100%;justify-self:center;align-self:end;margin:auto 0}
.big{display:flex;align-items:center;gap:12px;width:100%;height:60px;padding:0 10px;background-color:transparent;cursor:pointer;
  font-family:var(--display);font-weight:700;font-size:26px;line-height:1;color:var(--parch);text-align:left}
.big.f-ember{color:var(--soot)}
.big canvas{width:32px;height:32px;flex:none}
.big span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big:active{filter:brightness(1.18)}
.game.tiny .big{height:52px;font-size:23px}
.game.tiny .buttons{gap:8px}
/* Who's at the forge? (design pass 16, build 8): a phone with no player sees this plank in place of the three buttons: Grycus's face and
   his words at the door, a name, Into the forge (dim until the name is good, then glowing). While the field has the focus and the
   keyboard covers the screen, the plank rises into what the keyboard leaves and shrinks to the heading, the field and the button
   (.lifted: the script places it there, centred across what is left, following visualViewport). Centred like the buttons, a little
   wider than they are */
.who{grid-area:buttons;justify-self:center;align-self:end;margin:auto 0;display:grid;gap:6px;width:clamp(270px,calc(var(--gw) * .4),340px);max-width:100%;padding:6px 10px 10px;color:var(--ink);animation:rise .3s steps(4,end)}
.who h2{margin:0;font-family:var(--display);font-weight:800;font-size:27px;line-height:1;color:var(--ink)}
.who .speech{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 9px;align-items:center}
.who .speech canvas{display:block;width:48px;height:48px;background:var(--stone-2);border:2px solid #3a4466;box-shadow:0 0 0 2px var(--soot)}
.who .speech b{display:block;font-family:var(--data);font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--oak);line-height:1.2}
.who .speech span{display:block;font-size:14.5px;line-height:1.28;color:var(--ink)}
.who .fld{display:block;width:100%;height:38px;margin:0;padding:0 10px;font-family:var(--text);font-size:17px;background:var(--stone);color:var(--parch);border:2px solid var(--oak-d);border-radius:0;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
.who .fld::placeholder{color:var(--dim)}
.who .fld:focus-visible{outline:3px solid var(--ice);outline-offset:1px}
.who .why{min-height:15px;font-family:var(--data);font-size:11.5px;letter-spacing:.03em;line-height:1.25;color:var(--ink3)}
.who .go{display:block;width:100%;min-height:48px;padding:0 8px;background-color:transparent;cursor:pointer;font-family:var(--display);font-weight:800;font-size:22px;line-height:1;color:var(--soot)}
.who .go:disabled{opacity:.45;cursor:not-allowed}
.who .go.glow{animation:whoglow 1.1s ease-in-out infinite}
@keyframes whoglow{50%{box-shadow:0 0 16px 5px rgba(247,118,34,.8)}}
.game.tiny .who{gap:4px;padding:4px 10px 8px}
.game.tiny .who h2{font-size:23px}
.game.tiny .who .speech canvas{width:32px;height:32px}
.game.tiny .who .go{min-height:40px;font-size:20px}
.game.tiny .who .speech span{font-size:13px;line-height:1.22}
.game.tiny .who .fld{height:34px;font-size:16px}
.who.lifted{position:absolute;z-index:6;grid-area:auto;justify-self:auto;align-self:auto;margin:0;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;padding:3px 10px 6px;animation:none}
.who.lifted h2{grid-column:1/-1;grid-row:1;font-size:21px}
.who.lifted .speech{display:none}
.who.lifted .fld{grid-column:1;grid-row:2}
.who.lifted .go{grid-column:2;grid-row:2;width:auto;min-height:38px;padding:0 14px;font-size:19px}
.who.lifted .why{grid-column:1/-1;grid-row:3;min-height:0}
.who.lifted .why:empty{display:none}
.menu.typing .sign{visibility:hidden}
/* General Settings: a plank over the menu, its rows drawn by settings.js */
.veil{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(13,10,20,.66);
  padding:calc(8px + var(--st)) calc(8px + var(--sr)) calc(8px + var(--sb)) calc(8px + var(--sl))}
.game.forced .veil{padding:calc(8px + var(--sr)) calc(8px + var(--sb)) calc(8px + var(--sl)) calc(8px + var(--st))}
.plank{width:100%;max-width:400px;max-height:100%;overflow:auto;animation:rise .3s steps(4,end)}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.plank h2{margin:0 0 6px;text-align:center;font-family:var(--display);font-weight:800;font-size:28px;line-height:1;color:var(--parch)}
.set-rows{display:grid;gap:6px}
.set-row{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-items:center;width:100%;min-height:52px;padding:3px 8px;background-color:transparent;cursor:pointer;text-align:left}
.set-row b{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.05;color:var(--parch)}
.set-row i{grid-column:1;font-style:normal;font-family:var(--data);font-size:10.5px;letter-spacing:.03em;line-height:1.25;color:#c0cbdc}
.set-row span{grid-column:2;grid-row:1/span 2;font-family:var(--data);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.set-row[aria-pressed="true"] span,.set-row.set-phone span{color:var(--hot)}
.set-row.set-danger b{color:#f6757a}
.set-row.set-wide span{color:var(--brass)}
.set-btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.set-btns button{flex:1;min-width:120px;min-height:46px;padding:4px 6px;background-color:transparent;cursor:pointer;font-family:var(--display);font-weight:700;font-size:19px;line-height:1.05;color:var(--parch)}
.set-btns button.f-ember{color:var(--soot)}
.set-btns .set-erase{color:#f6757a}
.set-foot{margin:8px 0 0;text-align:center;font-family:var(--data);font-size:10px;letter-spacing:.04em;color:var(--dim)}
.set-ask{color:var(--ink);margin-top:2px}
.set-ask h3{margin:0 0 6px;text-align:center;font-family:var(--display);font-weight:800;font-size:26px;line-height:1;color:var(--ink)}
.set-ask p{margin:4px 0 8px;font-size:15px;color:var(--ink);text-align:center}
/* on a short game (a phone: 500 px or less high) the plank is wider and its rows are two columns (a little lower since build 8, which
   added Your name and Copy my playtest notes, so a 640 x 360 phone holds them all without scrolling) */
.game.short .plank.wide{max-width:640px}
.game.short .wide .set-rows{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.game.short .wide .set-row{min-height:0;padding:0 8px}
.game.short .wide h2{font-size:24px;margin-bottom:2px}
.game.short .wide .set-btns{margin-top:6px}
.game.short .wide .set-btns button{min-height:40px}
.game.short .wide .set-foot{margin-top:2px}
/* the turn plate: a phone held upright (the cellar's), fixed to the viewport, above the game */
.turn{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(18px + var(--st)) 18px calc(18px + var(--sb));text-align:center;background:rgba(24,20,37,.96)}
.turn canvas{width:96px;height:96px}
.turn b{font-family:var(--display);font-weight:800;font-size:27px;line-height:1.05;color:var(--parch)}
.turn p{margin:0;max-width:300px;font-size:14.5px;color:var(--mute)}
.turn button{width:min(88%,320px);min-height:44px;background-color:transparent;cursor:pointer;font-family:var(--display);font-weight:700;font-size:17px;color:var(--parch)}
.turn button.primary{color:var(--soot)}
/* the fade to and from black; the toast */
.fade{position:absolute;inset:0;z-index:30;background:#000;opacity:0;pointer-events:none;transition:opacity .25s steps(5,end)}
.fade.on{opacity:1}
.toast{position:absolute;left:50%;bottom:calc(14px + var(--sb));transform:translateX(-50%);z-index:8;max-width:88%;padding:4px 10px;font-family:var(--data);font-size:12px;color:var(--soot);background:var(--parch);border:3px solid var(--soot);box-shadow:0 0 0 3px var(--oak);opacity:0;transition:opacity .25s;pointer-events:none;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.still *{animation:none!important;transition:none!important}
</style>

<body data-forge="forge.html" data-battlegrounds="battlegrounds.html" data-menu="index.html" data-build="bd0312b" data-booted="0" data-errors="0">
<div class="game" id="game">
  <canvas class="vista" id="vista" role="img" aria-label="Rolling mountains at dusk: the sun low behind the far range, darker ranges nearer, a black hill with pines in front"></canvas>
  <main class="menu" id="menu">
    <header class="sign f-plank" id="sign"><h1>Forge Forever</h1></header>
    <nav class="buttons" id="buttons" aria-label="Main menu">
      <button class="big f-ember" id="menuForge"><canvas data-glyph="anvil" aria-hidden="true"></canvas><span>Forge</span></button>
      <button class="big f-iron" id="menuBattle"><canvas data-glyph="sword" aria-hidden="true"></canvas><span>Battlegrounds</span></button>
      <button class="big f-iron" id="menuSettings"><canvas data-glyph="cog" aria-hidden="true"></canvas><span>General Settings</span></button>
    </nav>
    <form class="who f-parch" id="who" hidden novalidate autocomplete="off" aria-labelledby="whoHead">
      <h2 id="whoHead">Who's at the forge?</h2>
      <div class="speech" id="whoSpeech"><div><b id="whoWho">Grycus</b><span id="whoWords">Someone's at my door! Who are you? Tell me your name.</span></div></div>
      <input class="fld" id="whoField" name="name" type="text" maxlength="16" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="Your name" aria-label="Your name" aria-describedby="whoWhy">
      <div class="why" id="whoWhy" aria-live="polite"></div>
      <button class="go f-ember" id="whoGo" type="submit" disabled>Into the forge</button>
    </form>
  </main>
  <div class="veil" id="setVeil" hidden>
    <div class="plank f-plank wide" id="setPlank" role="dialog" aria-label="General Settings">
      <h2>General Settings</h2>
      <div id="setBody"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <div class="fade on" id="fade"></div>
</div>
<div class="turn" id="turnPlate" hidden role="dialog" aria-label="Turn your phone sideways">
  <canvas id="turnPhone" width="32" height="32" role="img" aria-label="A phone tipping onto its side"></canvas>
  <b>Turn your phone sideways</b>
  <p>Forge Forever is played in landscape.</p>
  <button class="f-ember primary" id="tFull" hidden>Play full screen</button>
  <button class="f-iron" id="tForce">My screen won't turn</button>
</div>
