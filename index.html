<style>
/* Forge Forever: the main menu (design pass 9, card t66; built sideways first by design pass 11, card t69). The game's front door:
   rolling mountains at dusk over the whole screen (proto/dusk.js), the title on the smithy's oak sign hung from two chains, and three
   buttons. Sideways is the primary layout: the sign across the top, the buttons in a column on the right, the sun clear on the left.
   Upright: the sign, the sky, the buttons at the bottom. Either way up; it never locks the screen. One dark look on purpose, the
   Forge's: its frames, its three typefaces, its palette. */
:root{color-scheme:dark;--soot:#181425;--stone:#231c2e;--stone-2:#2c2540;--oak:#733e39;--oak-l:#b86f50;--oak-d:#3e2731;
  --parch:#ead4aa;--parch-2:#e4a672;--mute:#b3a48c;--dim:#8a7d6e;--ember:#f77622;--brass:#feae34;--hot:#fee761;--blood:#e43b44;--ice:#2ce8f5;
  --ink:#3e2731;--ink2:#733e39;--ink3:#a22633;
  --display:"Grenze Gotisch",Georgia,serif;--text:Alegreya,Georgia,serif;--data:"Pixelify Sans","Courier New",monospace;
  --st:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--soot);color:var(--parch);overscroll-behavior:none}
body{font-family:var(--text);font-size:16px;line-height:1.4;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;color:inherit;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--ice);outline-offset:2px}
.plank button:focus-visible{outline-offset:-3px}
/* pixel frames (9-slice, made by smithy.js); each has a flat ground in case the frames can't be drawn */
.f-plank{border:12px solid transparent;background:var(--stone) padding-box;border-image:var(--frame-plank) 4 fill round;image-rendering:pixelated}
.f-iron{border:9px solid transparent;background:#3a4466 padding-box;border-image:var(--frame-iron) 4 fill round;image-rendering:pixelated}
.f-ember{border:9px solid transparent;background:#e4572e padding-box;border-image:var(--frame-ember) 4 fill round;image-rendering:pixelated}
.f-parch{border:12px solid transparent;background:var(--parch) padding-box;border-image:var(--frame-parchment) 4 fill round;image-rendering:pixelated}
.f-plank>*,.f-parch>*,.f-iron>*,.f-ember>*{image-rendering:auto}
.f-plank canvas,.f-parch canvas,.f-iron canvas,.f-ember canvas{image-rendering:pixelated}
/* the vista: one canvas at a whole number of device pixels per world pixel, placed to cover the viewport (dusk.js sizes it) */
.vista{position:fixed;left:0;top:0;z-index:0;display:block;background:var(--soot)}
/* the page: sideways, the sign across the top and the buttons in the right column; upright, the sign, the sky, the buttons at the bottom */
.menu{position:fixed;inset:0;z-index:1;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"sign" "vista" "buttons";
  padding:calc(14px + var(--st)) calc(16px + var(--sr)) calc(16px + var(--sb)) calc(16px + var(--sl))}
/* the sign: the title on an oak board hung from two chains */
.sign{grid-area:sign;justify-self:center;position:relative;padding:2px 22px 8px;text-align:center;max-width:100%}
.sign h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(38px,min(12.4vw,11.5vh),64px);line-height:1.02;color:var(--parch);text-shadow:0 3px 0 var(--soot);white-space:nowrap;letter-spacing:0}
.sign::before,.sign::after{content:"";position:absolute;bottom:calc(100% + 12px);width:4px;height:100vh;
  background:repeating-linear-gradient(to bottom,#8b9bb4 0 2px,#5a6988 2px 4px,#262b44 4px 6px,#181425 6px 7px);box-shadow:-1px 0 0 #181425,1px 0 0 #181425}
.sign::before{left:10px}
.sign::after{right:10px}
/* the three buttons */
.buttons{grid-area:buttons;display:grid;gap:10px;width:100%;max-width:340px;justify-self:center;align-self:end}
.big{display:flex;align-items:center;gap:12px;width:100%;height:60px;padding:0 10px;background-color:transparent;cursor:pointer;
  font-family:var(--display);font-weight:700;font-size:26px;line-height:1;color:var(--parch);text-align:left}
.big.f-ember{color:var(--soot)}
.big canvas{width:32px;height:32px;flex:none}
.big span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big:active{filter:brightness(1.18)}
@media (max-height:340px){.big{height:52px;font-size:23px}.buttons{gap:8px}}
@media (orientation:landscape) and (min-width:560px){
  .menu{grid-template-columns:minmax(0,1fr) clamp(248px,34vw,300px);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"sign sign" "vista buttons";column-gap:28px}
  .buttons{max-width:none;justify-self:stretch;align-self:end;margin-bottom:clamp(0px,calc((100vh - 600px) * .35),160px)}
}
/* General Settings: a plank over the menu, its rows drawn by settings.js */
.veil{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(13,10,20,.66);
  padding:calc(8px + var(--st)) calc(8px + var(--sr)) calc(8px + var(--sb)) calc(8px + var(--sl))}
.plank{width:100%;max-width:400px;max-height:100%;overflow:auto;animation:rise .3s steps(4,end)}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.plank h2{margin:0 0 6px;text-align:center;font-family:var(--display);font-weight:800;font-size:28px;line-height:1;color:var(--parch)}
.set-rows{display:grid;gap:6px}
.set-row{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-items:center;width:100%;min-height:52px;padding:3px 8px;background-color:transparent;cursor:pointer;text-align:left}
.set-row b{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.05;color:var(--parch)}
.set-row i{grid-column:1;font-style:normal;font-family:var(--data);font-size:10.5px;letter-spacing:.03em;line-height:1.25;color:#c0cbdc}
.set-row span{grid-column:2;grid-row:1/span 2;font-family:var(--data);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.set-row[aria-pressed="true"] span,.set-row.set-phone span{color:var(--hot)}
.set-row.set-danger b{color:#f6757a}
.set-row.set-wide span{color:var(--brass)}
.set-btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.set-btns button{flex:1;min-width:120px;min-height:46px;padding:4px 6px;background-color:transparent;cursor:pointer;font-family:var(--display);font-weight:700;font-size:19px;line-height:1.05;color:var(--parch)}
.set-btns button.f-ember{color:var(--soot)}
.set-btns .set-erase{color:#f6757a}
.set-foot{margin:8px 0 0;text-align:center;font-family:var(--data);font-size:10px;letter-spacing:.04em;color:var(--dim)}
.set-ask{color:var(--ink);margin-top:2px}
.set-ask h3{margin:0 0 6px;text-align:center;font-family:var(--display);font-weight:800;font-size:26px;line-height:1;color:var(--ink)}
.set-ask p{margin:4px 0 8px;font-size:15px;color:var(--ink);text-align:center}
@media (orientation:landscape) and (max-height:500px){
  .plank.wide{max-width:640px}
  .wide .set-rows{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* the fade to and from black; the toast */
.fade{position:fixed;inset:0;z-index:30;background:#000;opacity:0;pointer-events:none;transition:opacity .25s steps(5,end)}
.fade.on{opacity:1}
.toast{position:fixed;left:50%;bottom:calc(14px + var(--sb));transform:translateX(-50%);z-index:8;max-width:88vw;padding:4px 10px;font-family:var(--data);font-size:12px;color:var(--soot);background:var(--parch);border:3px solid var(--soot);box-shadow:0 0 0 3px var(--oak);opacity:0;transition:opacity .25s;pointer-events:none;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.still *{animation:none!important;transition:none!important}
</style>
</head>
<body data-forge="forge.html" data-battlegrounds="battlegrounds.html" data-menu="index.html" data-build="4c2dd08" data-booted="0" data-errors="0">
<canvas class="vista" id="vista" role="img" aria-label="Rolling mountains at dusk: the sun low behind the far range, darker ranges nearer, a black hill with pines in front"></canvas>
<main class="menu" id="menu">
  <header class="sign f-plank" id="sign"><h1>Forge Forever</h1></header>
  <nav class="buttons" id="buttons" aria-label="Main menu">
    <button class="big f-ember" id="menuForge"><canvas data-glyph="anvil" aria-hidden="true"></canvas><span>Forge</span></button>
    <button class="big f-iron" id="menuBattle"><canvas data-glyph="sword" aria-hidden="true"></canvas><span>Battlegrounds</span></button>
    <button class="big f-iron" id="menuSettings"><canvas data-glyph="cog" aria-hidden="true"></canvas><span>General Settings</span></button>
  </nav>
</main>
<div class="veil" id="setVeil" hidden>
  <div class="plank f-plank wide" id="setPlank" role="dialog" aria-label="General Settings">
    <h2>General Settings</h2>
    <div id="setBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="fade on" id="fade"></div>
