<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Forge · Forge Forever</title>
<meta name="theme-color" content="#181425">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forge">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600;700;800&family=Alegreya:ital,wght@0,400;0,700;1,400&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Forge Forever: The Forge (design pass 2's smithy, pass 5's final layout, pass 6's named legends; sideways first since design pass 11,
   card t69, and landscape only since its amendment 9). One dark look on purpose. The page is an app frame that fills the screen: the
   sign across the top, the room the whole screen until a slot asks for the walls, which open on the right. A phone held upright sees
   the turn plate, or, with My screen won't turn, the frame laid out at height x width and turned a quarter (the cellar's rule).
   Since build 4 (design pass 14) the room is drawn as wide as the screen's shape, wall to wall: the cellar's door on the left, the
   Armory's on the right; with the walls open it keeps its height and is cut to the station.
   Since build 5 (design pass 15, card t70) the Armory is a room of its own (.app.in-armory: the hall of shelves in place of the smithy,
   the door at its left end back to the Forge), a plaque is a static card (three columns, nothing scrolls: the script fits it), and
   the forging's hammer floats without an arm. */
:root{color-scheme:dark;--soot:#181425;--stone:#231c2e;--stone-2:#2c2540;--oak:#733e39;--oak-l:#b86f50;--oak-d:#3e2731;--shelf:#241a2a;
  --parch:#ead4aa;--parch-2:#e4a672;--mute:#b3a48c;--dim:#8a7d6e;--ember:#f77622;--brass:#feae34;--hot:#fee761;--blood:#e43b44;--ice:#2ce8f5;--gold:#feae34;--gold-d:#be4a2f;
  --ink:#3e2731;--ink2:#733e39;--ink3:#a22633;--clay:#b86f50;
  --display:"Grenze Gotisch",Georgia,serif;--text:Alegreya,Georgia,serif;--data:"Pixelify Sans","Courier New",monospace;
  --st:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--soot);color:var(--parch);overscroll-behavior:none}
body{font-family:var(--text);font-size:16px;line-height:1.45;background-image:var(--bricks);background-size:56px 28px}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ice);outline-offset:2px}
.turn button:focus-visible{outline-offset:-3px}
/* pixel frames */
.f-plank{border:12px solid transparent;border-image:var(--frame-plank) 4 fill round;image-rendering:pixelated}
.f-iron{border:9px solid transparent;border-image:var(--frame-iron) 4 fill round;image-rendering:pixelated}
.f-ember{border:9px solid transparent;border-image:var(--frame-ember) 4 fill round;image-rendering:pixelated}
.f-parch{border:12px solid transparent;border-image:var(--frame-parchment) 4 fill round;image-rendering:pixelated}
.f-gold{border:12px solid transparent;border-image:var(--frame-gold) 4 fill round;image-rendering:pixelated}
.f-slot{border:9px solid transparent;border-image:var(--frame-slot) 4 fill round;image-rendering:pixelated}
.f-clay{border:9px solid transparent;border-image:var(--frame-clay) 4 fill round;image-rendering:pixelated}
.f-stone{border:9px solid transparent;border-image:var(--frame-stone) 4 fill round;image-rendering:pixelated}
.f-plank>*,.f-parch>*,.f-gold>*,.f-iron>*,.f-slot>*,.f-clay>*,.f-stone>*,.f-ember>*{image-rendering:auto}
.f-plank canvas,.f-slot canvas,.f-clay canvas,.f-parch canvas,.f-gold canvas,.f-iron canvas{image-rendering:pixelated}
/* the frame: the whole screen on a phone (padded by the safe areas), at most 1180 x 820 on a desktop, centred on the brick; in forced
   landscape it is laid out at height x width and turned a quarter (the script sizes it) */
.phone{position:fixed;inset:0;margin:auto;width:100%;height:100%;max-width:1180px;max-height:820px;padding:var(--st) var(--sr) var(--sb) var(--sl);background:var(--soot);overflow:hidden;transform-origin:0 0}
.phone.forced{margin:0;max-width:none;max-height:none;padding:var(--sr) var(--sb) var(--sl) var(--st)}
@media (min-width:1200px) and (min-height:840px){.phone{border:3px solid #0d0a14;box-shadow:0 0 0 3px var(--oak-d),0 16px 0 -4px #0d0a14}}
/* the app inside it: the sign across the top; the room the whole screen, or beside the walls pane when .open (a slot tapped); in the
   Armory (.in-armory) the hall takes the room's place; every overlay is placed against this box */
.app{position:relative;width:100%;height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"sign" "room"}
.app:not(.open) .wallspane{display:none}
.app.open{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"sign sign" "room walls"}
/* the sign, one row: the way home, the room's name, the title, the chips, the way to the other room (ARMORY, or FORGE from the Armory), the cog */
.sign{grid-area:sign;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto auto;grid-template-areas:"home name title chips armory cog";align-items:center;column-gap:8px;padding:6px 8px;background:var(--oak-d);border-bottom:3px solid var(--soot)}
.sign .home{width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;background:none;cursor:pointer}
.sign .home canvas{width:16px;height:16px}
.sign #homeBtn{grid-area:home}
.sign #setBtn{grid-area:cog}
.sign #setBtn[aria-pressed="true"]{border-image-source:var(--frame-plank)}
.sign h1{grid-area:name;margin:0;font-family:var(--display);font-weight:800;font-size:26px;line-height:1;color:var(--parch);white-space:nowrap}
.sign .title{grid-area:title;justify-self:start;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--data);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass)}
.sign #armoryBtn{grid-area:armory}
.sign .chips{grid-area:chips;display:flex;gap:4px;justify-content:flex-end;flex-wrap:nowrap;min-width:0}
.chip{height:30px;padding:0 6px;background:var(--stone);border:2px solid var(--stone-2);color:var(--parch);font-family:var(--data);font-size:12px;letter-spacing:.03em;display:flex;align-items:center;gap:4px;cursor:pointer}
.chip b{font-weight:600}
.chip .xp{display:block;width:34px;height:4px;background:var(--stone-2);position:relative}
.chip .xp i{position:absolute;left:0;top:0;bottom:0;background:var(--brass)}
.chip.coin i.c{width:9px;height:9px;border-radius:50%;background:var(--brass);box-shadow:inset -2px -2px 0 var(--gold-d)}
.chip.first i.s{color:var(--hot)}
.chip.ember i.e{color:var(--ember)}
.chip.shake{animation:shake .4s steps(4) 1}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.sign button.f-iron{height:34px;padding:0 5px;background:none;cursor:pointer;font-family:var(--data);font-size:12px;letter-spacing:.04em;color:var(--parch)}
/* the room pane: the smithy, then the state and price lines */
.roompane{grid-area:room;display:flex;flex-direction:column;align-items:center;min-height:0;min-width:0;overflow:hidden}
/* the room (design pass 14): a box the script sizes to fill the pane, clipping the lens; the lens is the smithy at its own width W
   (the screen's shape, 232 to 320 world pixels) and the forging's overlay, centred on the anvil, zoomed 2x while the hammer works */
.room{position:relative;width:100%;overflow:hidden;flex:none}
.lens{position:absolute;left:0;top:0;transform-origin:50% 78.57%}
.lens>canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#forgeFx{pointer-events:none}
/* the forging (design pass 10, in the wide room): from the melt to the plaque the lens is cut to 2x on the hearth and the anvil; the
   sequence hides the station's tabs, the slots and the doors; a landing puts .hit on the app for one beat: the flash at 28 % and the
   lens dropped 2 px */
.lens.near{transform:scale(2)}
.room.seq .stationbar,.room.seq .slots,.room.seq .door{visibility:hidden}
.app.hit>.flash{opacity:.28}
.app.hit .lens{top:2px}
/* the station's tabs hang from the beam over the hearth (design pass 14: the right corner is the Armory's) */
.stationbar{position:absolute;left:50%;top:6px;transform:translateX(-50%);display:flex;gap:0;z-index:2}
.stationbar button{height:30px;padding:0 8px;background:var(--stone);border:2px solid var(--stone-2);font-family:var(--display);font-weight:700;font-size:15px;color:var(--mute);cursor:pointer}
.stationbar button[aria-pressed="true"],.stationbar button[aria-selected="true"]{background:var(--oak);color:var(--hot);border-color:var(--oak-l)}
.stationbar button.dim{color:var(--dim)}
.stationbar button.dim small{font-family:var(--data);font-size:9px;margin-left:3px}
/* the two doors (design pass 14): buttons laid over the doors' own pixels (the script places them from the scene, in % of the lens),
   each under an oak plate: the cellar's on the left, down; the Armory's on the right, through. With the walls open the room shows only
   the station, and the doors are off it */
.door{position:absolute;padding:0;border:0;background:none;cursor:pointer;display:flex;align-items:flex-start;justify-content:center;z-index:1}
.doorplate{font-family:var(--data);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;padding:2px 7px;background:var(--oak);border:2px solid var(--oak-l);color:var(--hot);transform:translateY(calc(-100% - 3px))}
.doorplate.pulse{animation:pulse 1.4s steps(3) infinite}
.app.open .door{visibility:hidden}
/* Grycus, the smith (design pass 17, build 6): a button over his pixels (above the cellar door's where they meet in the narrowest
   rooms), and his words in a parchment bubble above his head, its tail on his crown; neither with the walls open, nor while forging or
   pouring */
.npc{position:absolute;padding:0;border:0;background:none;cursor:pointer;z-index:2;-webkit-tap-highlight-color:transparent}
.npc:focus-visible{outline:2px solid var(--ice);outline-offset:1px}
.say{position:absolute;z-index:3;transform:translate(-22px,-100%);width:max-content;max-width:240px;padding:5px 10px 7px;background:var(--parch);color:var(--soot);border:3px solid var(--soot);box-shadow:0 0 0 3px var(--oak);font-family:var(--text);font-size:14px;line-height:1.25;pointer-events:none}
.say.short{font-size:13px;line-height:1.2;padding:4px 9px 6px}
.say b{display:block;font-family:var(--data);font-weight:600;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--oak);margin-bottom:1px}
.say::after{content:"";position:absolute;left:13px;bottom:-12px;width:9px;height:9px;background:var(--parch);border-right:3px solid var(--soot);border-bottom:3px solid var(--soot);transform:skewY(40deg)}
.say.pop{animation:say .27s steps(3) 1}
@keyframes say{from{opacity:0;transform:translate(-22px,calc(-100% + 6px))}to{opacity:1;transform:translate(-22px,-100%)}}
.app.open .npc,.app.open .say,.room.seq .npc,.room.seq .say,.phone.pouring .say{visibility:hidden}
.slots{position:absolute;left:0;right:0;bottom:4%;display:flex;justify-content:center;align-items:flex-end;gap:6px;pointer-events:none}
.slots>*{pointer-events:auto}
.slotwrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.plate{font-family:var(--data);font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;background:var(--stone-2);border:2px solid var(--stone-2);color:var(--dim);line-height:1.2}
.plate.lit{background:var(--oak);color:var(--hot);border-color:var(--oak-l)}
.slot{width:74px;height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:none;padding:0;cursor:pointer}
.slot canvas{width:50px;height:50px}
.slot .l{font-family:var(--data);font-size:9px;line-height:1.1;max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--parch)}
.slot .e{font-family:var(--data);font-size:9px;color:var(--dim)}
.slot.pulse{animation:pulse .6s steps(3) 1}
.slot.slide{animation:slide .45s steps(3) 1}
@keyframes pulse{50%{filter:brightness(1.6)}}
@keyframes slide{0%{transform:translateX(80px)}100%{transform:none}}
.mid{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:10px}
.strike{height:46px;min-width:88px;padding:0 6px;background:none;font-family:var(--display);font-weight:800;font-size:21px;color:var(--soot);cursor:pointer}
.strike:disabled,.pour:disabled{border-image-source:var(--frame-stone);color:var(--dim);cursor:not-allowed}
.swap{height:26px;padding:0 6px;background:none;cursor:pointer;font-family:var(--data);font-size:12px;color:var(--parch)}
.socket{height:26px;padding:0 6px;background:none;font-family:var(--data);font-size:10px;letter-spacing:.03em;color:var(--parch);cursor:pointer}
.socket.glow{color:var(--hot);animation:pulse 1.2s steps(3) infinite}
.pour{position:relative;height:46px;min-width:88px;padding:0 6px;background:none;font-family:var(--display);font-weight:800;font-size:21px;color:var(--soot);cursor:pointer;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.pour .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,246,200,.55);pointer-events:none;transition:none}
.pour.holding .fill{width:100%;transition:width 1s linear}
.pour>span:last-child{position:relative}
.mold.melt canvas{animation:melt 2s steps(6) 1 forwards}
@keyframes melt{to{transform:translateY(18px) scaleY(.2);filter:brightness(2) saturate(2)}}
/* the flash covers the whole app: the hammer's landings (.app.hit, above) and the Crucible's burst of steam */
.app>.flash{position:absolute;inset:0;z-index:4;background:#fff6c8;opacity:0;pointer-events:none}
.quench .flash{animation:steam 1s steps(3,end) 1;background:#d8f4ff}
@keyframes steam{0%{opacity:.5}100%{opacity:0}}
/* the DOM sparks: the Crucible's pour and a naming's burst (Strike's sparks are in the overlay since design pass 10) */
.sparks{position:absolute;left:50%;top:70%;width:0;height:0;pointer-events:none}
.sparks i{position:absolute;width:4px;height:4px;opacity:0}
.burst .sparks i,.pouring .sparks i{animation:fly .7s steps(5,end) forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
.state{width:100%;font-family:var(--data);font-size:12px;letter-spacing:.04em;color:var(--mute);text-align:center;padding:6px 10px 0;min-height:24px}
.state.warn{color:var(--parch-2)}
.price{width:100%;font-family:var(--data);font-size:11px;letter-spacing:.03em;color:var(--dim);text-align:center;padding:0 10px 2px}
/* no footer: the status, cost and Armory lines under the room are hidden so the room takes the whole height (fitRoom reads their
   heights as 0); the script still writes them, so they stay in the page for the tests */
#state,#price,#armState{display:none!important}
/* plaques and planks (overlays inside the app): a wide card over the room; the planks and the first-weapon and unlock overlays stand
   over the walls pane while it is open, and may scroll. A plaque never scrolls (design pass 15) */
.plaque,.plank-over,.overlay{position:absolute;left:8%;right:8%;top:52px;bottom:8px;z-index:5;color:var(--soot);animation:rise .35s steps(4,end)}
.plank-over,.overlay{overflow:auto}
.plank-over{z-index:7;top:60px;left:22%;right:22%}
.overlay{z-index:6}
.app.open .plank-over,.app.open .overlay{left:calc(50% + 6px);right:8px}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
/* the plaque, a static card (design pass 15 on pass 10's clean plaque): the same box as before, and nothing in it scrolls. Three
   columns: the icon over its rarity band; the name, the recipe, the traits in words and a legend's Strike and Ability rows; the stats
   in a column of their own. Above them a slim row for the banners (First forged, A new kind); below, the buttons, who forged it and
   when, and TAP ANYWHERE TO CONTINUE. Every size inside is a multiple of --k and the icon is --art screen pixels to a sprite pixel;
   the script (fitPlaque) keeps the first fit the card holds: full size, then the icon a step smaller, then the letters (a long name
   takes a smaller letter, --kn, before a second line). The frame's border and the buttons' frames do not scale */
.plaque{--k:1;--kn:1;--art:4;display:grid;grid-template-columns:minmax(calc(132px*var(--k)),23%) minmax(0,1fr) minmax(calc(128px*var(--k)),22%);grid-template-rows:auto 1fr auto;column-gap:calc(14px*var(--k));overflow:hidden}
.plaque .banners{grid-column:1/-1;grid-row:1;display:flex;gap:calc(8px*var(--k));margin:0 0 calc(4px*var(--k))}
.plaque .banner{flex:1;min-width:0;text-align:center;font-family:var(--display);font-weight:800;font-size:calc(19px*var(--k));color:var(--soot);padding:0 4px;height:calc(18px + 13px*var(--k));line-height:calc(13px*var(--k));white-space:nowrap}
.plaque .side{grid-column:1;grid-row:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(8px*var(--k));min-width:0}
.plaque .main{grid-column:2;grid-row:2;min-width:0;align-self:center}
.plaque .stats{grid-column:3;grid-row:2;min-width:0;align-self:center;padding-right:calc(5px*var(--k))}
.plaque.nostats .main{grid-column:2/-1}
.plaque .foot{grid-column:1/-1;grid-row:3;display:flex;flex-direction:column;gap:calc(2px*var(--k));text-align:center;margin-top:calc(2px*var(--k))}
.plaque .art{display:flex;justify-content:center}
.plaque .art canvas{width:calc(33px*var(--art));height:calc(33px*var(--art))}
.plaque.gold .art canvas{filter:drop-shadow(0 0 4px var(--hot))}
.plaque h2{margin:0;text-align:left;font-family:var(--display);font-weight:800;font-size:calc(31px*var(--k)*var(--kn));line-height:1;color:var(--ink);text-wrap:balance}
.plaque h2.relit{animation:relit .9s steps(4) 1}
@keyframes relit{50%{color:var(--gold-d);text-shadow:0 0 6px var(--hot)}}
.plaque .kindline,.plaque .traits,.plaque .named{text-align:left;font-family:var(--data);font-size:calc(11px*var(--k));letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);margin-top:calc(3px*var(--k))}
.plaque .traits{text-wrap:balance}
.plaque .named{letter-spacing:.06em;margin-top:0}
.plaque .named:empty{display:none}
.plaque .line{text-align:left;font-size:calc(13.5px*var(--k));color:var(--ink);margin:calc(3px*var(--k)) 0}
.plaque .line b{font-family:var(--display);font-weight:700;font-size:calc(16px*var(--k))}
/* a legend's two moves (design pass 10 section 3.5.6): Strike, the body's form and first status; Ability, the head's, on its own button */
.moves{margin:calc(5px*var(--k)) 0 calc(2px*var(--k));display:grid;gap:calc(3px*var(--k))}
.moves>div{display:grid;grid-template-columns:calc(62px*var(--k)) minmax(0,1fr);gap:calc(8px*var(--k));align-items:start;padding:calc(3px*var(--k)) calc(8px*var(--k));background:rgba(190,74,47,.07);border:2px solid #e4a672}
.moves b{font-family:var(--data);font-size:calc(10.5px*var(--k));line-height:calc(14px*var(--k));letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600;padding-top:calc(2px*var(--k))}
.moves b small{display:block;font-size:calc(9.5px*var(--k));font-weight:400;letter-spacing:.05em;color:#a0785a}
.moves span{font-size:calc(13.5px*var(--k));line-height:1.3;color:var(--ink)}
.moves em{font-style:normal;font-family:var(--display);font-weight:700;font-size:calc(17px*var(--k));color:var(--ink)}
/* the stats: eight bars in one column */
.bars{display:grid;grid-template-columns:minmax(0,1fr);gap:calc(3px*var(--k)) 0}
.bar{display:grid;grid-template-columns:calc(62px*var(--k)) minmax(0,1fr) calc(15px*var(--k));gap:calc(4px*var(--k));align-items:center;font-family:var(--data);font-size:calc(10.5px*var(--k));line-height:1.25;text-transform:uppercase;letter-spacing:.04em;color:var(--ink)}
.bar>span:last-child{text-align:right}
.bar .pips{display:grid;grid-template-columns:repeat(10,1fr);gap:1px}
.bar .pips i{height:calc(6px*var(--k));background:#c28569}
.bar .pips i.on{background:#a22633}
.bar.off{opacity:.4}
.pbtns{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.pbtns button{flex:1;min-width:84px;min-height:40px;height:auto;line-height:1.05;padding:4px 2px;background:none;cursor:pointer;font-family:var(--display);font-weight:700;font-size:17px;color:var(--parch)}
.pbtns button.primary{color:var(--soot)}
.pbtns button.goldbtn{border-image-source:var(--frame-gold);color:var(--ink)}
.pbtns button:disabled{border-image-source:var(--frame-stone);color:var(--dim);cursor:not-allowed}
.tryit{display:block;width:100%;min-height:40px;margin-top:6px;padding:2px 6px;background:none;cursor:pointer;font-family:var(--display);font-weight:700;font-size:17px;line-height:1.05;color:var(--parch)}
.tryit small{font-family:var(--data);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin-left:6px}
/* the plaque's foot: the buttons in one row, who forged it and when, TAP ANYWHERE TO CONTINUE */
.plaque .foot .btnrow{display:flex;gap:calc(6px*var(--k));align-items:stretch}
.plaque .foot .btnrow .pbtns{flex:1;margin-top:0;gap:calc(6px*var(--k));flex-wrap:nowrap}

        </div>

        </div>
        <div class="wallhead" id="wallHead"></div>
        <div class="wall" id="wall"></div>
        <div class="cabinet" id="cabinet" hidden>
          <div class="cabhead"><button class="f-iron" id="back">← Wall</button><b id="cabTitle"></b><span class="n" id="cabCount"></span></div>
          <div class="giftline" id="giftLine" hidden></div>

          <div class="chips2" id="chips"></div>
          <div class="shelves" id="shelves"><div class="spacer" id="spacer"></div></div>
          <div class="carthead" id="cartHead" hidden><span id="cartLine"></span><button class="bulk f-iron" id="bulk" aria-pressed="false">×5</button></div>
          <div class="cart" id="cart" hidden></div>
        </div>
      </div>
    </div>

          <button role="tab" id="pgLegends" aria-selected="false">Legends</button>
        </div>
        <button class="f-iron armnav prev" id="armPrev" hidden aria-label="Back along the shelves">‹</button>
        <button class="f-iron armnav next" id="armNext" hidden aria-label="Further along the shelves">›</button>
      </div>
      <div class="state" id="armState" role="status"></div>
    </div>
    <div class="veil" aria-hidden="true"></div>
    <div class="flash"></div>
    <div class="plaque f-parch" id="plaque" hidden></div>
