<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Forge · Forge Forever</title>
<meta name="theme-color" content="#181425">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forge">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600;700;800&family=Alegreya:ital,wght@0,400;0,700;1,400&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Forge Forever: The Forge (design pass 2's smithy, pass 5's final layout, pass 6's named legends; sideways first since design pass 11,
   card t69, and landscape only since its amendment 9). One dark look on purpose. The page is an app frame that fills the screen: the
   sign across the top, the room the whole screen until a slot asks for the walls, which open on the right. A phone held upright sees
   the turn plate, or, with My screen won't turn, the frame laid out at height x width and turned a quarter (the cellar's rule).
   Since build 4 (design pass 14) the room is drawn as wide as the screen's shape, wall to wall: the cellar's door on the left, the
   Armory's on the right; with the walls open it keeps its height and is cut to the station.
   Since build 5 (design pass 15, card t70) the Armory is a room of its own (.app.in-armory: the hall of shelves in place of the smithy,
   the door at its left end back to the Forge), a plaque is a static card (three columns, nothing scrolls: the script fits it), and
   the forging's hammer floats without an arm.
   Since build 17 (design passes 24 and 25, settled by pass 26) the page is the castle: four rooms under one sign. The Courtyard
   (.app.in-yard: a walked yard at the cellar's scale, the stick on the left half, the prompt over the knight, tap to go), the Forge
   (its left door out to the yard, its right wall the Rack of the two hands), the Armory, and the Map Table (.app.in-map: the map of
   the realm on its table, the names as buttons over the canvas, the area's plate and the legend's). Nell's, Vorn's and the Rack's
   lists share one oak plank (#folkPlank). The sign's one plate is ← Courtyard, in the Map Table only.
   Since build 20 (design pass 31, card t89) the walls pane is bare: no head line over a wall, no gift line under a shelf's name, no
   chip row on a shelf; the shelf takes their height. */
:root{color-scheme:dark;--soot:#181425;--stone:#231c2e;--stone-2:#2c2540;--oak:#733e39;--oak-l:#b86f50;--oak-d:#3e2731;--shelf:#241a2a;
  --parch:#ead4aa;--parch-2:#e4a672;--mute:#b3a48c;--dim:#8a7d6e;--ember:#f77622;--brass:#feae34;--hot:#fee761;--blood:#e43b44;--ice:#2ce8f5;--gold:#feae34;--gold-d:#be4a2f;
  --ink:#3e2731;--ink2:#733e39;--ink3:#a22633;--clay:#b86f50;
  --display:"Grenze Gotisch",Georgia,serif;--text:Alegreya,Georgia,serif;--data:"Pixelify Sans","Courier New",monospace;
  --st:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--soot);color:var(--parch);overscroll-behavior:none}
body{font-family:var(--text);font-size:16px;line-height:1.45;background-image:var(--bricks);background-size:56px 28px}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ice);outline-offset:2px}
.turn button:focus-visible{outline-offset:-3px}
/* pixel frames */
.f-plank{border:12px solid transparent;border-image:var(--frame-plank) 4 fill round;image-rendering:pixelated}
.f-iron{border:9px solid transparent;border-image:var(--frame-iron) 4 fill round;image-rendering:pixelated}
.f-ember{border:9px solid transparent;border-image:var(--frame-ember) 4 fill round;image-rendering:pixelated}
.f-parch{border:12px solid transparent;border-image:var(--frame-parchment) 4 fill round;image-rendering:pixelated}
.f-gold{border:12px solid transparent;border-image:var(--frame-gold) 4 fill round;image-rendering:pixelated}
.f-slot{border:9px solid transparent;border-image:var(--frame-slot) 4 fill round;image-rendering:pixelated}
.f-clay{border:9px solid transparent;border-image:var(--frame-clay) 4 fill round;image-rendering:pixelated}
.f-stone{border:9px solid transparent;border-image:var(--frame-stone) 4 fill round;image-rendering:pixelated}
.f-plank>*,.f-parch>*,.f-gold>*,.f-iron>*,.f-slot>*,.f-clay>*,.f-stone>*,.f-ember>*{image-rendering:auto}
.f-plank canvas,.f-slot canvas,.f-clay canvas,.f-parch canvas,.f-gold canvas,.f-iron canvas{image-rendering:pixelated}
/* the frame: the whole screen on a phone, to the glass's edges (design pass 30, build 19: no padding; the picture runs under the notch and
   the home indicator), at most 1180 x 820 on a desktop, centred on the brick; in forced landscape it is laid out at height x width and
   turned a quarter (the script sizes it). The four game insets, --gl --gt --gr --gb, are the phone's safe-area insets as the game sees
   them, turned with it: every control that sits against an edge (the sign's row, the slots, the plaque, the planks, Settings, the toast,
   the Armory's arrows, the map's plates, the yard's stick) adds its edge's inset, and only the controls do. #probe carries them for the
   script (the cellar's device) */
.phone{position:fixed;inset:0;margin:auto;width:100%;height:100%;max-width:1180px;max-height:820px;background:var(--soot);overflow:hidden;transform-origin:0 0;--gl:var(--sl);--gt:var(--st);--gr:var(--sr);--gb:var(--sb)}
.phone.forced{margin:0;max-width:none;max-height:none;--gt:var(--sr);--gr:var(--sb);--gb:var(--sl);--gl:var(--st)}
#probe{position:absolute;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:var(--gt,0px) var(--gr,0px) var(--gb,0px) var(--gl,0px)}
@media (min-width:1200px) and (min-height:840px){.phone{border:3px solid #0d0a14;box-shadow:0 0 0 3px var(--oak-d),0 16px 0 -4px #0d0a14}}
/* the app inside it: the sign across the top; the room the whole screen, or beside the walls pane when .open (a slot tapped); in the
   Armory (.in-armory) the hall takes the room's place; every overlay is placed against this box */
.app{position:relative;width:100%;height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"sign" "room"}
.app:not(.open) .wallspane{display:none}
.app.open{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"sign sign" "room walls"}
/* the sign, one row: the way home, the room's name, the title, the chips, ← Courtyard (in the Map Table only; the slot is the old ARMORY button's), the cog */
.sign{grid-area:sign;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto auto;grid-template-areas:"home name title chips armory cog";align-items:center;column-gap:8px;padding:calc(6px + var(--gt,0px)) calc(8px + var(--gr,0px)) 6px calc(8px + var(--gl,0px));background:var(--oak-d);border-bottom:3px solid var(--soot)}
.sign .home{width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;background:none;cursor:pointer}
.sign .home canvas{width:16px;height:16px}
.sign #homeBtn{grid-area:home}
.sign #setBtn{grid-area:cog}
.sign #setBtn[aria-pressed="true"]{border-image-source:var(--frame-plank)}
.sign h1{grid-area:name;margin:0;font-family:var(--display);font-weight:800;font-size:26px;line-height:1;color:var(--parch);white-space:nowrap}
.sign .title{grid-area:title;justify-self:start;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--data);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass)}
.sign #armoryBtn{grid-area:armory}
.sign .chips{grid-area:chips;display:flex;gap:4px;justify-content:flex-end;flex-wrap:nowrap;min-width:0}
.chip{height:30px;padding:0 6px;background:var(--stone);border:2px solid var(--stone-2);color:var(--parch);font-family:var(--data);font-size:12px;letter-spacing:.03em;display:flex;align-items:center;gap:4px;cursor:pointer}
.chip b{font-weight:600}
.chip .xp{display:block;width:34px;height:4px;background:var(--stone-2);position:relative}
.chip .xp i{position:absolute;left:0;top:0;bottom:0;background:var(--brass);transition:width .4s steps(4)}
/* "+N XP" at the Lv chip when a forge pays (design pass 19 section 3.4): it appears just under the chip and rises 14 px into it in six
   steps over 0.9 s, fading as it arrives; over the plaque (z 5) and the lessons' layer (6 to 8), so neither dims it. Under less motion
   (.hold) it stands in place for 1.2 s */
#chipLevel{position:relative}
.xprise{position:absolute;left:50%;top:100%;margin-top:2px;transform:translate(-50%,0);z-index:9;white-space:nowrap;font-family:var(--data);font-weight:600;font-size:14px;line-height:1;letter-spacing:0;color:var(--hot);pointer-events:none;opacity:0;
  text-shadow:1px 0 0 var(--soot),-1px 0 0 var(--soot),0 1px 0 var(--soot),0 -1px 0 var(--soot),1px 1px 0 var(--soot),-1px 1px 0 var(--soot),1px -1px 0 var(--soot),-1px -1px 0 var(--soot)}
.xprise.go,.xprise.hold{opacity:1}
.xprise.go{animation:xprise .9s steps(6) forwards,xpfade .9s linear forwards}
@keyframes xprise{from{transform:translate(-50%,0)}to{transform:translate(-50%,-14px)}}
@keyframes xpfade{0%,70%{opacity:1}100%{opacity:0}}
.chip.coin i.c{width:9px;height:9px;border-radius:50%;background:var(--brass);box-shadow:inset -2px -2px 0 var(--gold-d)}
.chip.first i.s{color:var(--hot)}
.chip.ember i.e{color:var(--ember)}
.chip.shake{animation:shake .4s steps(4) 1}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.sign button.f-iron{height:34px;padding:0 5px;background:none;cursor:pointer;font-family:var(--data);font-size:12px;letter-spacing:.04em;color:var(--parch)}
/* the room pane: the smithy, then the state and price lines */
.roompane{grid-area:room;display:flex;flex-direction:column;align-items:center;min-height:0;min-width:0;overflow:hidden}
/* the room (design pass 14): a box the script sizes to fill the pane, clipping the lens; the lens is the smithy at its own width W
   (the screen's shape, 232 to 320 world pixels) and the forging's overlay, centred on the anvil, zoomed 2x while the hammer works */
.room{position:relative;width:100%;overflow:hidden;flex:none}
.lens{position:absolute;left:0;top:0;transform-origin:50% 78.57%}
.lens>canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#forgeFx{pointer-events:none}
/* the forging (design pass 10, in the wide room): from the melt to the plaque the lens is cut to 2x on the hearth and the anvil; the
   sequence hides the station's tabs, the slots and the doors; a landing puts .hit on the app for one beat: the flash at 28 % and the
   lens dropped 2 px */
.lens.near{transform:scale(2)}
.room.seq .stationbar,.room.seq .slots,.room.seq .door{visibility:hidden}
.app.hit>.flash{opacity:.28}
.app.hit .lens{top:2px}
/* the station's tabs hang from the beam over the hearth (design pass 14: the right corner is the Armory's) */
.stationbar{position:absolute;left:50%;top:6px;transform:translateX(-50%);display:flex;gap:0;z-index:2}
.stationbar button{height:30px;padding:0 8px;background:var(--stone);border:2px solid var(--stone-2);font-family:var(--display);font-weight:700;font-size:15px;color:var(--mute);cursor:pointer}
.stationbar button[aria-pressed="true"],.stationbar button[aria-selected="true"]{background:var(--oak);color:var(--hot);border-color:var(--oak-l)}
.stationbar button.dim{color:var(--dim)}
.stationbar button.dim small{font-family:var(--data);font-size:9px;margin-left:3px}
/* the two doors (design pass 14): buttons laid over the doors' own pixels (the script places them from the scene, in % of the lens),
   each under an oak plate. Since build 17 (design pass 24 section 4.10) the left door goes out to the courtyard and the right wall is
   the Rack (#rackDoor, its plate RACK; the two hands hang on its pegs, drawn on #pegs over the room's canvas). With the walls open the
   room shows only the station, and the doors are off it. #cellarDoor and #armoryDoor stay as hidden stubs for the script of the build
   before, which reaches for them at load */
.door{position:absolute;padding:0;border:0;background:none;cursor:pointer;display:flex;align-items:flex-start;justify-content:center;z-index:1}
.doorplate{font-family:var(--data);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;padding:2px 7px;background:var(--oak);border:2px solid var(--oak-l);color:var(--hot);transform:translateY(calc(-100% - 3px))}
.doorplate.pulse{animation:pulse 1.4s steps(3) infinite}
.app.open .door,.app.open #pegs,.room.seq #pegs{visibility:hidden}
#pegs{position:absolute;pointer-events:none;z-index:1}
/* Grycus, the smith (design pass 17, build 6): a button over his pixels (above the cellar door's where they meet in the narrowest
   rooms), and his words in a parchment bubble above his head, its tail on his crown; neither with the walls open, nor while forging or
   pouring */
.npc{position:absolute;padding:0;border:0;background:none;cursor:pointer;z-index:2;-webkit-tap-highlight-color:transparent}
.npc:focus-visible{outline:2px solid var(--ice);outline-offset:1px}
.say{position:absolute;z-index:3;transform:translate(-22px,-100%);width:max-content;max-width:240px;padding:5px 10px 7px;background:var(--parch);color:var(--soot);border:3px solid var(--soot);box-shadow:0 0 0 3px var(--oak);font-family:var(--text);font-size:14px;line-height:1.25;pointer-events:none}
.say.short{font-size:13px;line-height:1.2;padding:4px 9px 6px}
.say b{display:block;font-family:var(--data);font-weight:600;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--oak);margin-bottom:1px}
.say::after{content:"";position:absolute;left:13px;bottom:-12px;width:9px;height:9px;background:var(--parch);border-right:3px solid var(--soot);border-bottom:3px solid var(--soot);transform:skewY(40deg)}
.say.pop{animation:say .27s steps(3) 1}
@keyframes say{from{opacity:0;transform:translate(-22px,calc(-100% + 6px))}to{opacity:1;transform:translate(-22px,-100%)}}
.app.open .npc,.app.open .say,.room.seq .npc,.room.seq .say,.phone.pouring .say{visibility:hidden}
.slots{position:absolute;left:0;right:0;bottom:calc(4% + var(--gb,0px));display:flex;justify-content:center;align-items:flex-end;gap:6px;pointer-events:none}
.slots>*{pointer-events:auto}
.slotwrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.plate{font-family:var(--data);font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;background:var(--stone-2);border:2px solid var(--stone-2);color:var(--dim);line-height:1.2}
.plate.lit{background:var(--oak);color:var(--hot);border-color:var(--oak-l)}
.slot{width:74px;height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:none;padding:0;cursor:pointer}
.slot canvas{width:50px;height:50px}
.slot .l{font-family:var(--data);font-size:9px;line-height:1.1;max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--parch)}
.slot .e{font-family:var(--data);font-size:9px;color:var(--dim)}
.slot.pulse{animation:pulse .6s steps(3) 1}
.slot.slide{animation:slide .45s steps(3) 1}
@keyframes pulse{50%{filter:brightness(1.6)}}
@keyframes slide{0%{transform:translateX(80px)}100%{transform:none}}
.mid{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:10px}
.strike{height:46px;min-width:88px;padding:0 6px;background:none;font-family:var(--display);font-weight:800;font-size:21px;color:var(--soot);cursor:pointer}
.strike:disabled,.pour:disabled{border-image-source:var(--frame-stone);color:var(--dim);cursor:not-allowed}
.swap{height:26px;padding:0 6px;background:none;cursor:pointer;font-family:var(--data);font-size:12px;color:var(--parch)}
.socket{height:26px;padding:0 6px;background:none;font-family:var(--data);font-size:10px;letter-spacing:.03em;color:var(--parch);cursor:pointer}
.socket.glow{color:var(--hot);animation:pulse 1.2s steps(3) infinite}
.pour{position:relative;height:46px;min-width:88px;padding:0 6px;background:none;font-family:var(--display);font-weight:800;font-size:21px;color:var(--soot);cursor:pointer;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.pour .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,246,200,.55);pointer-events:none;transition:none}
.pour.holding .fill{width:100%;transition:width 1s linear}
.pour>span:last-child{position:relative}
.mold.melt canvas{animation:melt 2s steps(6) 1 forwards}
@keyframes melt{to{transform:translateY(18px) scaleY(.2);filter:brightness(2) saturate(2)}}
/* the flash covers the whole app: the hammer's landings (.app.hit, above) and the Crucible's burst of steam */
.app>.flash{position:absolute;inset:0;z-index:4;background:#fff6c8;opacity:0;pointer-events:none}
.quench .flash{animation:steam 1s steps(3,end) 1;background:#d8f4ff}
@keyframes steam{0%{opacity:.5}100%{opacity:0}}
/* the DOM sparks: the Crucible's pour and a naming's burst (Strike's sparks are in the overlay since design pass 10) */
.sparks{position:absolute;left:50%;top:70%;width:0;height:0;pointer-events:none}
.sparks i{position:absolute;width:4px;height:4px;opacity:0}
.burst .sparks i,.pouring .sparks i{animation:fly .7s steps(5,end) forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
.state{width:100%;font-family:var(--data);font-size:12px;letter-spacing:.04em;color:var(--mute);text-align:center;padding:6px 10px 0;min-height:24px}
.state.warn{color:var(--parch-2)}
.price{width:100%;font-family:var(--data);font-size:11px;letter-spacing:.03em;color:var(--dim);text-align:center;padding:0 10px 2px}
/* no footer: the status, cost and Armory lines under the room are hidden so the room takes the whole height (fitRoom reads their
   heights as 0); the script still writes them, so they stay in the page for the tests */
#state,#price,#armState{display:none!important}
/* plaques and planks (overlays inside the app): a wide card over the room; the planks and the first-weapon and unlock overlays stand
   over the walls pane while it is open, and may scroll. A plaque never scrolls (design pass 15) */
.plaque,.plank-over,.overlay{position:absolute;left:8%;right:8%;top:52px;bottom:calc(8px + var(--gb,0px));z-index:5;color:var(--soot);animation:rise .35s steps(4,end)}
.plank-over,.overlay{overflow:auto}
.plank-over{z-index:7;top:60px;left:22%;right:22%}
.overlay{z-index:6}
.app.open .plank-over,.app.open .overlay{left:calc(50% + 6px);right:8px}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
/* the plaque, a static card (design pass 15 on pass 10's clean plaque): the same box as before, and nothing in it scrolls. Three
   columns: the icon over its rarity band; the name, the recipe, the traits in words and a legend's Strike and Ability rows; the stats
   in a column of their own. Above them a slim row for the banners (First forged, A new kind); below, the buttons, who forged it and
   when, and TAP ANYWHERE TO CONTINUE. Every size inside is a multiple of --k and the icon is --art screen pixels to a sprite pixel;
   the script (fitPlaque) keeps the first fit the card holds: full size, then the icon a step smaller, then the letters (a long name
   takes a smaller letter, --kn, before a second line). The frame's border and the buttons' frames do not scale */
.plaque{--k:1;--kn:1;--art:4;display:grid;grid-template-columns:minmax(calc(132px*var(--k)),23%) minmax(0,1fr) minmax(calc(128px*var(--k)),22%);grid-template-rows:auto 1fr auto;column-gap:calc(14px*var(--k));overflow:hidden}
.plaque .banners{grid-column:1/-1;grid-row:1;display:flex;gap:calc(8px*var(--k));margin:0 0 calc(4px*var(--k))}
.plaque .banner{flex:1;min-width:0;text-align:center;font-family:var(--display);font-weight:800;font-size:calc(19px*var(--k));color:var(--soot);padding:0 4px;height:calc(18px + 13px*var(--k));line-height:calc(13px*var(--k));white-space:nowrap}
.plaque .side{grid-column:1;grid-row:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(8px*var(--k));min-width:0}
.plaque .main{grid-column:2;grid-row:2;min-width:0;align-self:center}
.plaque .stats{grid-column:3;grid-row:2;min-width:0;align-self:center;padding-right:calc(5px*var(--k))}
.plaque.nostats .main{grid-column:2/-1}
.plaque .foot{grid-column:1/-1;grid-row:3;display:flex;flex-direction:column;gap:calc(2px*var(--k));text-align:center;margin-top:calc(2px*var(--k))}
.plaque .art{display:flex;justify-content:center}
.plaque .art canvas{width:calc(33px*var(--art));height:calc(33px*var(--art))}
.plaque.gold .art canvas{filter:drop-shadow(0 0 4px var(--hot))}
.plaque h2{margin:0;text-align:left;font-family:var(--display);font-weight:800;font-size:calc(31px*var(--k)*var(--kn));line-height:1;color:var(--ink);text-wrap:balance}
.plaque h2.relit{animation:relit .9s steps(4) 1}
@keyframes relit{50%{color:var(--gold-d);text-shadow:0 0 6px var(--hot)}}
.plaque .kindline,.plaque .traits,.plaque .named{text-align:left;font-family:var(--data);font-size:calc(11px*var(--k));letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);margin-top:calc(3px*var(--k))}
.plaque .traits{text-wrap:balance}
.plaque .named{letter-spacing:.06em;margin-top:0}
.plaque .named:empty{display:none}
.plaque .line{text-align:left;font-size:calc(13.5px*var(--k));color:var(--ink);margin:calc(3px*var(--k)) 0}
.plaque .line b{font-family:var(--display);font-weight:700;font-size:calc(16px*var(--k))}
/* a legend's two moves (design pass 10 section 3.5.6): Strike, the body's form and first status; Ability, the head's, on its own button */
.moves{margin:calc(5px*var(--k)) 0 calc(2px*var(--k));display:grid;gap:calc(3px*var(--k))}
.moves>div{display:grid;grid-template-columns:calc(62px*var(--k)) minmax(0,1fr);gap:calc(8px*var(--k));align-items:start;padding:calc(3px*var(--k)) calc(8px*var(--k));background:rgba(190,74,47,.07);border:2px solid #e4a672}
.moves b{font-family:var(--data);font-size:calc(10.5px*var(--k));line-height:calc(14px*var(--k));letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600;padding-top:calc(2px*var(--k))}
.moves b small{display:block;font-size:calc(9.5px*var(--k));font-weight:400;letter-spacing:.05em;color:#a0785a}
.moves span{font-size:calc(13.5px*var(--k));line-height:1.3;color:var(--ink)}
.moves em{font-style:normal;font-family:var(--display);font-weight:700;font-size:calc(17px*var(--k));color:var(--ink)}
/* the stats: eight bars in one column */
.bars{display:grid;grid-template-columns:minmax(0,1fr);gap:calc(3px*var(--k)) 0}
.bar{display:grid;grid-template-columns:calc(62px*var(--k)) minmax(0,1fr) calc(15px*var(--k));gap:calc(4px*var(--k));align-items:center;font-family:var(--data);font-size:calc(10.5px*var(--k));line-height:1.25;text-transform:uppercase;letter-spacing:.04em;color:var(--ink)}
.bar>span:last-child{text-align:right}
.bar .pips{display:grid;grid-template-columns:repeat(10,1fr);gap:1px}
.bar .pips i{height:calc(6px*var(--k));background:#c28569}
.bar .pips i.on{background:#a22633}
.bar.off{opacity:.4}
.pbtns{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.pbtns button{flex:1;min-width:84px;min-height:40px;height:auto;line-height:1.05;padding:4px 2px;background:none;cursor:pointer;font-family:var(--display);font-weight:700;font-size:17px;color:var(--parch)}
.pbtns button.primary{color:var(--soot)}
.pbtns button.goldbtn{border-image-source:var(--frame-gold);color:var(--ink)}
.pbtns button:disabled{border-image-source:var(--frame-stone);color:var(--dim);cursor:not-allowed}
.tryit{display:block;width:100%;min-height:40px;margin-top:6px;padding:2px 6px;background:none;cursor:pointer;font-family:var(--display);font-weight:700;font-size:17px;line-height:1.05;color:var(--parch)}
.tryit small{font-family:var(--data);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin-left:6px}
/* the plaque's foot: the buttons in one row, who forged it and when, TAP ANYWHERE TO CONTINUE */
.plaque .foot .btnrow{display:flex;gap:calc(6px*var(--k));align-items:stretch}
.plaque .foot .btnrow .pbtns{flex:1;margin-top:0;gap:calc(6px*var(--k));flex-wrap:nowrap}
.plaque .foot .btnrow .tryit{flex:1;width:auto;margin-top:0}
.plaque .pbtns button,.plaque .tryit{min-width:0;min-height:calc(40px*var(--k));font-size:calc(17px*var(--k));white-space:nowrap}
.plaque .tryit small{font-size:calc(10px*var(--k))}
.plaque .foot .disc{margin:calc(3px*var(--k)) 0 0;text-align:center;line-height:1.25}
.plaque .disc b{color:var(--ink);font-weight:600}
.tapon{display:block;width:100%;margin:0;padding:calc(3px*var(--k)) 0 calc(2px*var(--k));background:none;border:0;cursor:pointer;font-family:var(--data);font-weight:600;font-size:calc(15px*var(--k));line-height:1.2;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);animation:tapblink 1.6s steps(4) infinite}
@keyframes tapblink{50%{opacity:.4}}
/* the rarity band under the icon (design pass 10 section 3.3.2's colours) */
.rarity{display:inline-flex;align-items:center;justify-content:center;min-width:calc(112px*var(--k,1));padding:calc(3px*var(--k,1)) calc(10px*var(--k,1));border:2px solid var(--soot);box-shadow:inset 0 2px 0 var(--rl),inset 0 -2px 0 var(--rd);font-family:var(--data);font-weight:600;font-size:calc(12px*var(--k,1));line-height:1.3;letter-spacing:.16em;text-transform:uppercase;color:#fff;text-shadow:1px 1px 0 var(--rd)}
.r1{background:#5a6988;--rl:#8b9bb4;--rd:#3a4466}.r2{background:#3e8948;--rl:#63c74d;--rd:#265c42}.r3{background:#124e89;--rl:#0099db;--rd:#262b44}
.r4{background:#68386c;--rl:#b55088;--rd:#3e2731}.r5{background:#f77622;--rl:#feae34;--rd:#be4a2f;color:var(--soot);text-shadow:none}.r6{background:#a22633;--rl:#e43b44;--rd:#3e2731;color:#fee761}
/* the naming and terms planks */
.plank-over h3{margin:0 0 6px;text-align:center;font-family:var(--display);font-weight:800;font-size:25px;line-height:1;color:var(--ink)}
.plank-over .row{display:flex;gap:8px;align-items:center}
.plank-over .row canvas{width:66px;height:66px;flex:none}
.field{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:40px;padding:0 4px;color:var(--parch)}
.field input{flex:1;min-width:0;height:28px;background:none;border:0;color:var(--parch);font-family:var(--data);font-size:15px;padding:0 2px}
.field input::selection{background:var(--ice);color:var(--soot)}
.field .count{font-family:var(--data);font-size:11px;color:var(--mute);flex:none}
.nline{font-family:var(--data);font-size:12px;letter-spacing:.03em;color:var(--ink2);margin:8px 2px 0;min-height:18px}
.nline.bad{color:var(--ink3)}
.nline .dot{display:inline-block;width:8px;height:8px;background:var(--ember);margin-right:6px;vertical-align:0;animation:pulse .8s steps(2) infinite}
.terms{font-size:13px;line-height:1.4;color:var(--ink);max-height:190px;overflow:auto;padding:6px 8px;background:rgba(255,250,240,.55);border:2px solid var(--parch-2);margin:6px 0}
.terms ol{padding-left:18px;margin:0}
.terms li{margin:3px 0}
.terms p{margin:0 0 4px;font-style:italic}
.tick{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink);margin:6px 2px;cursor:pointer}
.tick input{width:18px;height:18px;margin:0;accent-color:var(--ink)}
.plank-over .body{font-size:14.5px;color:var(--ink);text-align:center;margin:4px 0 6px}
/* the first-weapon screen and the unlock plaque */
.overlay .head{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.05;color:var(--ink);text-align:center;margin:0 0 4px}
.overlay .sub{text-align:center;font-size:14px;color:var(--ink);margin:0 0 8px}
.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.app.open .choices{grid-template-columns:repeat(2,minmax(0,1fr))}
.choice{display:flex;flex-direction:column;align-items:center;background:none;cursor:pointer;padding:4px 0 6px;color:var(--parch);position:relative}
.choice canvas{width:66px;height:66px}
.choice b{font-family:var(--display);font-weight:700;font-size:19px;line-height:1}
.choice span{font-family:var(--data);font-size:10px;color:var(--brass);text-align:center;line-height:1.2;padding:0 4px}
.choice.chained canvas{filter:grayscale(1) brightness(.6)}
.choice.chained::after{content:"";position:absolute;left:8px;right:8px;top:36%;height:5px;background:repeating-linear-gradient(90deg,#8b9bb4 0 4px,#262b44 4px 8px);transform:rotate(-12deg)}
.choice[aria-pressed="true"]{outline:3px solid var(--hot);outline-offset:-3px}
/* the walls pane: tabs, then the wall or the cabinet; the scrolling part takes what the pane leaves */
.wallspane{grid-area:walls;display:flex;flex-direction:column;min-height:0;min-width:0}
#walls{display:flex;flex-direction:column;min-height:0;flex:1}
.tabs{display:flex;gap:6px;padding:8px 10px 0}
.tabs button{flex:1;height:42px;padding:0;background:none;cursor:pointer;font-family:var(--display);font-weight:700;font-size:19px;color:var(--parch);position:relative}
.tabs button[aria-selected="true"]{border-image-source:var(--frame-plank);color:var(--hot)}
.tabs .badge{position:absolute;right:2px;top:-6px;font-family:var(--data);font-size:9px;letter-spacing:.03em;text-transform:uppercase;background:var(--ember);color:var(--soot);padding:1px 5px}
#wallsClose{display:flex;align-items:center;justify-content:center;flex:0 0 42px;width:42px;height:42px;padding:0;background:none;cursor:pointer;font-family:var(--data);font-size:16px;color:var(--parch)}
.wall{padding:8px 10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex:1;min-height:0;overflow:auto;align-content:start}
.rack{display:flex;flex-direction:column;align-items:center;background:none;cursor:pointer;padding:0 0 2px;min-width:0;color:var(--parch);position:relative}
.rack canvas{width:66px;height:66px}
.rack b{font-family:var(--display);font-weight:700;font-size:17px;line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rack span{font-family:var(--data);font-size:10.5px;color:var(--brass)}
.rack.q{opacity:.5;cursor:default}
.rack.q b{font-size:40px;line-height:66px}
.rack.gold{border-image-source:var(--frame-gold);color:var(--ink)}
.rack.gold span{color:var(--gold-d)}
.rack.chained canvas{filter:grayscale(1) brightness(.6)}
.rack.chained::after{content:"";position:absolute;left:6px;right:6px;top:34%;height:5px;background:repeating-linear-gradient(90deg,#8b9bb4 0 4px,#262b44 4px 8px);transform:rotate(-12deg);pointer-events:none}
.rack.chained span{color:var(--dim)}
.rack.new{animation:newrack 1.2s steps(6) 2}
@keyframes newrack{50%{filter:brightness(1.8) drop-shadow(0 0 6px var(--hot))}}
.cabinet{padding:8px 10px 10px;display:flex;flex-direction:column;min-height:0;flex:1}
.cabhead{display:flex;align-items:center;gap:6px}
.cabhead b{flex:1;font-family:var(--display);font-weight:800;font-size:24px;line-height:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cabhead .n{font-family:var(--data);font-size:12px;color:var(--brass)}
.cabhead button,.tools button{height:34px;background:none;cursor:pointer;font-family:var(--data);font-size:12px;letter-spacing:.03em;color:var(--parch);padding:0 4px}
.tools{display:flex;gap:6px;align-items:center;margin:6px 0}
.tools input{flex:1;min-width:0;height:34px;font-family:var(--data);font-size:12px;color:var(--parch);background:none;padding:0 4px}
.tools input::placeholder{color:var(--dim)}
.shelves{flex:1;min-height:120px;overflow:auto;background:var(--shelf);position:relative;border:3px solid var(--soot)}
.shelves .spacer{position:relative}
.shelf{position:absolute;left:0;right:0;height:96px;display:grid;align-items:end;padding:0 4px 12px;background:var(--board) bottom/32px 16px repeat-x;image-rendering:pixelated}
.shelfitem{position:relative;display:flex;flex-direction:column;align-items:center;background:none;border:0;cursor:pointer;padding:0;min-width:0;color:var(--parch)}
.shelfitem canvas{width:66px;height:66px}
.shelfitem span{font-family:var(--data);font-size:9.5px;line-height:1.05;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;image-rendering:auto}
.shelfitem .x{position:absolute;right:2px;top:0;font-family:var(--data);font-size:10px;color:var(--soot);background:var(--brass);padding:0 3px}
.shelfitem .buy{position:absolute;left:2px;top:0;font-family:var(--data);font-size:9px;color:var(--soot);background:var(--parch-2);padding:0 3px}
.shelfitem.out canvas{filter:grayscale(1) brightness(.55)}
.shelfitem.dim canvas{filter:grayscale(.8) brightness(.45)}
.shelfitem.dim span{color:var(--dim)}
.shelfitem.picked canvas{filter:drop-shadow(0 0 3px var(--hot))}
.shelfitem.glow{animation:newrack 1s steps(5) 3}
.empty{font-family:var(--data);font-size:12px;color:var(--dim);text-align:center;padding:40px 10px}
/* the cart */
.cart{flex:1;min-height:120px;overflow:auto;background:var(--shelf);border:3px solid var(--soot);padding:6px}
.cartrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:center;padding:4px 2px;border-bottom:2px solid var(--stone-2);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:var(--parch);cursor:pointer}
.cartrow canvas{width:44px;height:44px}
.cartrow .n{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.05}
.cartrow .s{font-family:var(--data);font-size:10px;color:var(--mute)}
.cartrow .tag{font-family:var(--data);font-size:12px;color:var(--soot);background:var(--brass);padding:2px 6px;border:2px solid var(--gold-d);white-space:nowrap}
.cartrow .tag.red{background:var(--blood);border-color:#a22633;color:#fff}
.cartrow .tag.off{background:var(--stone-2);border-color:var(--stone);color:var(--dim)}
.cartrow.sold .tag{background:var(--stone-2);border-color:var(--stone);color:var(--dim)}
.carthead{display:flex;gap:6px;align-items:center;margin:6px 0;font-family:var(--data);font-size:11px;color:var(--mute)}
.carthead .bulk{margin-left:auto;height:28px;padding:0 6px;background:none;cursor:pointer;font-family:var(--data);font-size:11px;color:var(--parch)}
.carthead .bulk[aria-pressed="true"]{color:var(--hot)}
/* the Armory (design pass 15): a room of its own. In it the hall takes the room's place under the sign: a sideways scroller as long
   as the collection, painted in the smithy's pixels in chunks (armory.js), with a button and a sprite for every weapon near the
   screen. Everything in the track is placed in world pixels: left and top from --x and --y, sizes from the track's --s (CSS pixels to
   a world pixel, the Forge's own scale). The tabs hang under the beam where the Forge's station tabs do; the arrows walk the hall
   for a mouse; a veil of soot lifts off the room that was walked into */
.armpane{grid-area:room;grid-column:1/-1;display:flex;flex-direction:column;align-items:center;min-height:0;min-width:0;overflow:hidden}
.app:not(.in-armory) .armpane,.app.in-armory .roompane,.app.in-armory .wallspane{display:none}
.armroom{position:relative;width:100%;flex:none;overflow:hidden}
.hall{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;touch-action:pan-x pan-y;overscroll-behavior:contain;outline:none}
.hall::-webkit-scrollbar{display:none}
.phone.forced .hall{touch-action:none}
.hall:focus-visible{box-shadow:inset 0 0 0 3px var(--ice)}
.track{position:relative;height:100%;width:calc(var(--s)*var(--w)*1px);--s:2;--w:232}
.track>*{position:absolute;left:calc(var(--s)*var(--x)*1px);top:calc(var(--s)*var(--y,0)*1px)}
.hc{width:calc(var(--s)*var(--cw)*1px);height:calc(var(--s)*112px);pointer-events:none}
.track .door{width:calc(var(--s)*var(--dw)*1px);height:calc(var(--s)*var(--dh)*1px)}
/* a weapon on its shelf: a button the size of its cell holding the sprite at the room's scale; ★ for a first of the smith's own, ×n
   when more than one is held (since 2026-10-07 only weapons held stand here: nothing is greyed) */
.aw{width:calc(var(--s)*36px);height:calc(var(--s)*36px);padding:0;border:0;background:none;cursor:pointer;color:var(--parch)}
.aw canvas{position:absolute;left:calc(var(--s)*2px);top:0;width:calc(var(--s)*33px);height:calc(var(--s)*33px)}
.aw:focus-visible{outline-offset:-3px}
@media (hover:hover){.aw:hover canvas{filter:brightness(1.3) drop-shadow(0 0 3px var(--hot))}}
.aw .st{position:absolute;left:calc(var(--s)*2px);top:0;font-family:var(--data);font-size:11px;line-height:1;color:var(--hot);text-shadow:1px 1px 0 var(--soot),-1px 0 0 var(--soot),0 -1px 0 var(--soot)}
.aw .x{position:absolute;right:calc(var(--s)*2px);top:0;font-family:var(--data);font-size:10px;line-height:1.2;color:var(--soot);background:var(--brass);padding:0 3px}
/* the plates: a class and its count on the floor before its bay, a button that opens the whole class (+N when the shelves show
   only the rarest six); a legend's name and lines under its case; a note on the bare wall */
.bayfoot{width:calc(var(--s)*var(--bw)*1px);display:flex;justify-content:center;pointer-events:none}
.bayplate{position:sticky;left:46px;right:46px;display:flex;gap:6px;align-items:baseline;white-space:nowrap;padding:2px 7px;background:var(--oak);border:2px solid var(--oak-l);border-radius:0;font-family:var(--data);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--hot);pointer-events:auto;cursor:pointer;appearance:none;-webkit-appearance:none;line-height:1.3}
.bayplate span{color:var(--parch)}
.bayplate .more{font-style:normal;color:var(--soot);background:var(--brass);padding:0 4px;margin-left:2px}
.bayplate:focus-visible{outline:2px solid var(--hot);outline-offset:1px}
@media (hover:hover){.bayplate:hover{border-color:var(--hot)}}
.legcap{transform:translateX(-50%);width:calc(var(--s)*68px);display:flex;flex-direction:column;align-items:center;text-align:center;pointer-events:none}
.legcap b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--display);font-weight:700;font-size:16px;line-height:1.1;color:var(--hot);text-shadow:0 2px 0 var(--soot)}
.legcap span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--data);font-size:9.5px;letter-spacing:.04em;line-height:1.3;color:var(--parch);text-shadow:1px 1px 0 var(--soot)}
.wallnote{white-space:nowrap;padding:3px 9px;background:var(--stone);border:2px solid var(--stone-2);font-family:var(--data);font-size:11px;letter-spacing:.04em;color:var(--mute);pointer-events:none}
.armnav{position:absolute;bottom:calc(5px + var(--gb,0px));z-index:2;width:38px;height:44px;padding:0;background:none;cursor:pointer;font-family:var(--data);font-size:20px;line-height:1;color:var(--parch)}
.armnav.prev{left:calc(4px + var(--gl,0px))}
.armnav.next{right:calc(4px + var(--gr,0px))}
.app>.veil{grid-area:room;grid-column:1/-1;z-index:3;background:var(--soot);opacity:0;pointer-events:none}
.app.walk>.veil{animation:walk .32s steps(4,end) 1}
@keyframes walk{0%{opacity:1}100%{opacity:0}}
/* the Courtyard (design pass 24, build 17): a room of its own in the Armory's pattern. The pane fills the app under the sign on
   stone; the canvas is the view in world pixels at the cellar's scale (the script sizes it, a whole number of device pixels to a
   world pixel), centred when the pane is bigger than the yard; the prompt floats over the knight; the stick floats to where the
   thumb lands in the left half (the right with Left-handed); the lessons' ring, arrow and chevron are drawn on the canvas */
.yardpane{grid-area:room;grid-column:1/-1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0;overflow:hidden;background:var(--stone)}
.app:not(.in-yard) .yardpane,.app.in-yard .roompane,.app.in-yard .wallspane,.app.in-yard .armpane{display:none}
#yard{display:block;background:var(--soot)}
.yprompt{position:absolute;height:30px;padding:0 8px;display:flex;align-items:center;transform:translate(-50%,-100%);cursor:pointer;background-color:transparent;font-family:var(--data);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--hot);white-space:nowrap;z-index:3}
#yardZone{position:absolute;left:0;top:0;bottom:0;width:50%;touch-action:none;z-index:2}
.app.lefty #yardZone{left:auto;right:0}
.ystick{position:absolute;width:88px;height:88px;margin:-44px 0 0 -44px;border-radius:50%;border:2px solid rgba(234,212,170,.35);background:rgba(24,20,37,.35);pointer-events:none!important;z-index:2}
.ystick i{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:rgba(234,212,170,.55);border:2px solid rgba(24,20,37,.6)}
.ystick.rest{left:calc(66px + var(--gl,0px));bottom:calc(66px + var(--gb,0px));top:auto;margin:0 0 -44px -44px;opacity:.45}
.app.lefty .ystick.rest{left:auto;right:calc(22px + var(--gr,0px))}
/* the yard's own notes: "+50" rising into the coin chip as "+N XP" does, and the "!" over Vorn is drawn on the canvas */
#chipCoins{position:relative}
.coinrise{position:absolute;left:50%;top:100%;margin-top:2px;transform:translate(-50%,0);z-index:9;white-space:nowrap;font-family:var(--data);font-weight:600;font-size:14px;line-height:1;color:var(--hot);pointer-events:none;opacity:0;
  text-shadow:1px 0 0 var(--soot),-1px 0 0 var(--soot),0 1px 0 var(--soot),0 -1px 0 var(--soot),1px 1px 0 var(--soot),-1px 1px 0 var(--soot),1px -1px 0 var(--soot),-1px -1px 0 var(--soot)}
.coinrise.go,.coinrise.hold{opacity:1}
.coinrise.go{animation:xprise .9s steps(6) forwards,xpfade .9s linear forwards}
/* the Map Table (design pass 25, build 17): the table from above with the map in its middle at the largest whole scale that fits it
   under the sign; the names are buttons over the canvas (Grenze Gotisch in dark ink with a parchment halo); the area's plate and
   the legend's are oak planks at a side; Go's soot curtain */
.mappane{grid-area:room;grid-column:1/-1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0;overflow:hidden;background:#2a1d28}
.app:not(.in-map) .mappane,.app.in-map .roompane,.app.in-map .wallspane,.app.in-map .armpane{display:none}
#map{display:block}
#mapLabels{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}

/* the folk's plank (Nell's cart, Vorn's weapons, the Rack): one oak plank; a head with a face or a crest, a title, a line and the
   coins; a bar; a list of rows (the cart's rows, on oak) */
.folk{left:12%;right:12%;top:52px;bottom:8px;display:flex;flex-direction:column;color:var(--parch)}
.folk .fhead{display:flex;gap:10px;align-items:flex-start;padding-bottom:6px;border-bottom:2px solid var(--oak-l);flex:none}
.folk .fhead canvas{width:48px;height:48px;flex:none;background:#2a1d28;border:2px solid #3e2731;box-shadow:0 0 0 2px var(--soot)}
.folk .fwho{font-family:var(--data);font-size:11px;letter-spacing:.12em;color:var(--brass);font-weight:600}
.folk .fsays{font-size:15px;line-height:1.3;margin-top:2px;color:var(--parch)}
.folk .fsays.red{color:#f6757a}
.folk .fx{margin-left:auto;flex:none;width:34px;height:34px;padding:0;background:none;cursor:pointer;font-family:var(--data);font-size:16px;color:var(--parch)}
.folk .fbar{display:flex;gap:10px;align-items:center;font-family:var(--data);font-size:11.5px;letter-spacing:.03em;margin:6px 0;color:var(--mute);flex:none;flex-wrap:wrap}
.folk .fbar b{color:var(--hot);font-weight:600}
.folk .fbar .free{color:#63c74d}
.folk .fbar .bulk{margin-left:auto;height:28px;padding:0 6px;background:none;cursor:pointer;font-family:var(--data);font-size:11px;color:var(--parch)}
.folk .fbar .bulk[aria-pressed="true"]{color:var(--hot)}
.folk .flist{flex:1;min-height:0;overflow:auto;background:var(--shelf);border:3px solid var(--soot);padding:4px 6px}
.folk .flist .grp{font-family:var(--data);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);margin:8px 2px 2px}
.folk .flist .cartrow .tag.free{background:#63c74d;border-color:#265c42;color:var(--soot)}
.folk .flist .cartrow .tag.own{background:transparent;border-color:var(--stone-2);color:var(--mute)}
.folk .flist .cartrow.lit{animation:newrack 1s steps(5) 3}
.folk .flist .cartrow[disabled]{opacity:.6;cursor:default}
.folk .flist .cartrow.chained canvas{filter:grayscale(1) brightness(.6)}
/* the Rack's two hands: two big slots over the list, the one in front marked */
.folk .hands{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;margin:6px 0;flex:none}
.folk .hand{display:flex;align-items:center;gap:8px;min-height:62px;padding:4px 8px;background:none;text-align:left;color:var(--parch);cursor:pointer}
.folk .hand canvas{width:50px;height:50px;flex:none}
.folk .hand b{display:block;font-family:var(--display);font-weight:700;font-size:16px;line-height:1.05;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folk .hand span{display:block;font-family:var(--data);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass)}
.folk .hand.front{border-image-source:var(--frame-plank)}
.folk .hand.empty b{color:var(--dim)}
.folk .swaphands{height:40px;padding:0 10px;background:none;cursor:pointer;font-family:var(--data);font-size:12px;color:var(--parch)}
/* Settings: the four switches (settings.js), Erase, and under Developer the bench that used to sit beside the phone */
.setplank{left:calc(8px + var(--gl,0px));right:calc(8px + var(--gr,0px));top:52px;bottom:calc(8px + var(--gb,0px));overflow:auto;color:var(--parch)}
.setplank h3{color:var(--parch)}
.set-rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.set-row{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-items:center;width:100%;min-height:52px;padding:3px 8px;background:none;cursor:pointer;text-align:left}
.set-row b{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.05;color:var(--parch)}
.set-row i{grid-column:1;font-style:normal;font-family:var(--data);font-size:10.5px;letter-spacing:.03em;line-height:1.25;color:#c0cbdc}
.set-row span{grid-column:2;grid-row:1/span 2;font-family:var(--data);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.set-row[aria-pressed="true"] span,.set-row.set-phone span{color:var(--hot)}
.set-row.set-danger b{color:#f6757a}
.set-btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.set-btns button{flex:1;min-width:120px;min-height:46px;padding:4px 6px;background:none;cursor:pointer;font-family:var(--display);font-weight:700;font-size:19px;line-height:1.05;color:var(--parch)}
.set-btns button.f-ember{color:var(--soot)}
.set-btns .set-erase{color:#f6757a}
.set-foot{margin:8px 0 0;text-align:center;font-family:var(--data);font-size:10px;letter-spacing:.04em;color:var(--dim)}
.set-ask{color:var(--ink);margin-top:2px}
.set-ask h3{margin:0 0 6px;text-align:center;font-family:var(--display);font-weight:800;font-size:26px;line-height:1;color:var(--ink)}
.set-ask p{margin:4px 0 8px;font-size:15px;color:var(--ink);text-align:center}
.bench{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:14px;padding-top:10px;border-top:2px dotted var(--stone-2)}
.bench .k{grid-column:1/-1;font-family:var(--data);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass)}
.bench button{min-height:44px;background:none;cursor:pointer;font-family:var(--display);font-weight:700;font-size:18px;line-height:1.05;color:var(--parch);padding:2px 6px}
.bench .row{display:flex;gap:6px;align-items:center;min-width:0}
.bench .row button{flex:1;min-width:0}
.bench input[type=text],.bench input[type=number]{height:40px;min-width:0;font-family:var(--data);font-size:12px;color:var(--parch);background:none;padding:0 6px}
.bench input[type=number]{width:70px;flex:none}
.bench input[type=text]{flex:1}
.bench label{font-family:var(--data);font-size:11px;color:var(--mute);display:flex;gap:4px;align-items:center;flex:none}
.bench .info{grid-column:1/-1;font-family:var(--data);font-size:11.5px;color:var(--mute);letter-spacing:.03em;margin:0}
/* the toast, inside the frame so it turns with it */
.toast{position:absolute;left:50%;bottom:calc(24px + var(--gb,0px));transform:translateX(-50%);z-index:20;font-family:var(--data);font-size:13px;color:var(--soot);background:var(--parch);border:3px solid var(--soot);box-shadow:0 0 0 3px var(--oak);padding:6px 12px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
/* the turn plate: a phone held upright (the cellar's), fixed to the viewport, above the frame */
.turn{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(18px + var(--st)) 18px calc(18px + var(--sb));text-align:center;background:rgba(24,20,37,.96)}
.turn canvas{width:96px;height:96px}
.turn b{font-family:var(--display);font-weight:800;font-size:27px;line-height:1.05;color:var(--parch)}
.turn p{margin:0;max-width:300px;font-size:14.5px;color:var(--mute)}
.turn button{width:min(88%,320px);min-height:44px;background:none;cursor:pointer;font-family:var(--display);font-weight:700;font-size:17px;color:var(--parch)}
.turn button.primary{color:var(--soot)}
.turn button canvas{width:16px;height:16px;vertical-align:-2px;margin-right:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.pour.holding .fill{width:100%}}
.still *{animation:none!important;transition:none!important}
.still .pour.holding .fill{width:100%}
